<VirtualHost *:80>
    ServerName sandbox.3eb.site
    DocumentRoot /var/www/app/public
    Alias /vendor/monaco/vs/ /opt/threeebs/monaco/vs/
    <Directory /opt/threeebs/monaco/vs>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>
    <Directory /var/www/app/public>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        FallbackResource /index.php
    </Directory>
    ErrorLog /var/log/apache2/error.log
    CustomLog /var/log/apache2/access.log combined
</VirtualHost>
